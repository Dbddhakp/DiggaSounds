name: Build Resource Pack

on:
  push:
    paths:
      - 'pack.mcmeta'
      - 'assets/**'
      - '.github/workflows/build-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          rm -f DiggaSounds-Pack-26.2.zip DiggaSounds-Pack-26.2-SHA1.txt
          zip -r DiggaSounds-Pack-26.2.zip pack.mcmeta assets
          sha1sum DiggaSounds-Pack-26.2.zip | awk '{print $1}' > DiggaSounds-Pack-26.2-SHA1.txt
      - name: Commit build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DiggaSounds-Pack-26.2.zip DiggaSounds-Pack-26.2-SHA1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build resource pack'
          git push
